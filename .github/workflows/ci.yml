name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values: unit tests use in-memory SQLite, not these credentials.
      APP_DB_NAME: ci
      APP_DB_USER: ci
      APP_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  backend-migrations:
    name: Backend · migrations PostgreSQL + pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smartcampus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d smartcampus_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      APP_DB_NAME: smartcampus_ci
      APP_DB_USER: ci
      APP_DB_PASSWORD: ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Activer pgvector (comme db/init/01-init.sh)
        run: psql -h localhost -U ci -d smartcampus_ci -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Upgrade jusqu'à head
        run: alembic upgrade head
      - name: Vérifier que les modèles correspondent aux migrations
        run: alembic check
      - name: Downgrade puis upgrade (migrations réversibles)
        run: |
          alembic downgrade base
          alembic upgrade head

  eval-tests:
    name: Évaluation LLM · tests (Ollama simulé)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/llm_comparison/requirements.txt
      - run: pip install -r eval/llm_comparison/requirements.txt
      - run: python -m pytest eval/llm_comparison/tests -q

  frontend:
    name: Frontend · build + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker · compose + images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Créer un .env de CI à partir de l'exemple
        run: cp .env.example .env
      - name: Valider docker-compose.yml
        run: docker compose --profile apps config --quiet
      - name: Construire les images backend et frontend
        run: docker compose --profile apps build
